name: CI Quality & Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Windmill Packaging, Security, Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Root TypeScript typecheck (independent of Windmill staged files)
        run: npm run typecheck

      - name: Prepare Windmill full-code app shared library
        run: npm run windmill:prepare

      - name: Validate Windmill full-code app package closure & standalone typecheck
        run: npm run windmill:validate

      - name: Mandatory security regression & predicate tests
        run: npm run test:security

      - name: Unit, component & state transition tests
        run: npm run test:unit

      - name: Full unit & offline reliability tests
        run: npm run test

      - name: Production Vite build
        run: npm run build

      - name: Install Playwright Chromium browser & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright browser E2E tests
        run: npm run test:e2e
